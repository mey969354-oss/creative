<!DOCTYPE html>

:root{--orange:#ff9b78;--orange-deep:#ff7d55;--yellow:#ffd66c;--cream:#fff5ee;--ink:#17120f;--peach:#ffc6af;--white:#fffaf6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--orange);overflow-x:hidden}
a{text-decoration:none;color:inherit}
header{padding:14px 32px 0;background:var(--orange);position:sticky;top:0;z-index:50}
.nav{max-width:1500px;margin:auto;background:var(--cream);border:3px solid var(--ink);border-radius:28px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:10px 10px 0 var(--ink)}
.brand{display:flex;align-items:center;gap:16px;font-size:1.35rem;font-weight:900;line-height:1.25}
.brand-mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--orange-deep);border:3px solid var(--ink);font-weight:900;font-size:1.2rem}
nav a{font-size:1.05rem;font-weight:900;margin-left:26px}
nav a:hover{color:#d64f31}
.hero{min-height:790px;position:relative;overflow:hidden;padding:92px 34px 70px}
.hero::before{content:"";position:absolute;width:430px;height:430px;border-radius:50%;right:-100px;top:8px;background:var(--yellow);border:3px solid var(--ink)}
.hero::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-90px;bottom:-35px;background:var(--peach);border:3px solid var(--ink)}
.hero-wrap{width:min(1500px,100%);margin:auto;display:grid;grid-template-columns:1.02fr .98fr;gap:50px;position:relative;z-index:2}
.badge{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:10px 18px;box-shadow:6px 6px 0 var(--ink);font-weight:900;font-size:1.05rem}
.hero h1,.page-hero h1{margin:38px 0 24px;font-size:clamp(4.8rem,8.6vw,8.9rem);line-height:.84;letter-spacing:-7px;text-transform:uppercase}
.stroke{color:transparent;-webkit-text-stroke:3px var(--ink)}
.hero p,.page-hero p{max-width:750px;font-size:1.3rem;font-weight:700}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;border:3px solid var(--ink);background:var(--ink);color:white;border-radius:999px;padding:14px 22px;font-weight:900;box-shadow:6px 6px 0 rgba(0,0,0,.2)}
